[project]
name = "asset-mgmt"
version = "0.1.0"
description = "Estimate true breadth N and test whether it holds up under market stress"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "openpyxl",
    "duckdb>=1.1,<3",
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
